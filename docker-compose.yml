services:
  backend:
    build:
      context: ./backend
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - app-network
    
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:81:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 64M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge