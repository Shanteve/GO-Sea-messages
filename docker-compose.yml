services:
  bottle-api:
    build:
      context: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_interval: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M